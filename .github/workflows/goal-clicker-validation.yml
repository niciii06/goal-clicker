name: Goal Clicker Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-fund
      - name: Check lockfile repair
        run: node --test tests/repair-lockfile.test.mjs
      - name: Check TypeScript
        run: npm run typecheck
      - name: Check lint
        run: npm run lint
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run tests
        run: npm test
      - name: Install Chromium for browser tests
        run: npx playwright-core install --with-deps chromium
      - name: Run browser smoke tests against the production build
        run: npm run test:browser
