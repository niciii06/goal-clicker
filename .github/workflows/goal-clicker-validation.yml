name: Goal Clicker Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      # Scratch database for the PostgreSQL tests; never a real Supabase project.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: goalclicker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-fund
      - name: Check lockfile repair
        run: node --test tests/repair-lockfile.test.mjs
      - name: Check TypeScript
        run: npm run typecheck
      - name: Check lint
        run: npm run lint
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run tests
        run: npm test
      - name: Run PostgreSQL tests
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/goalclicker_test
      - name: Install Chromium for browser tests
        run: npx playwright-core install --with-deps chromium
      - name: Run browser smoke tests against the production build
        run: npm run test:browser
      - name: Run account browser tests (login, profile, cloud save)
        run: npm run test:account
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/goalclicker_test
