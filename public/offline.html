<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07130e">
<title>Goal Clicker · Keine Verbindung</title>
<link rel="icon" href="/favicon.svg">
<style>
  :root { color-scheme: light dark; --bg: #f3f6f4; --text: #102018; --soft: #4b5d53; --accent: #0a7d43; --on-accent: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #07130e; --text: #e8f3ec; --soft: #9db3a6; --accent: #3ddc84; --on-accent: #07130e; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  main { max-width: 360px; }
  img { width: 72px; height: 72px; }
  h1 { margin: 16px 0 8px; font-size: 1.4rem; }
  p { margin: 0 0 20px; color: var(--soft); }
  button { min-height: 44px; padding: 0 22px; border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Keine Verbindung</h1>
  <p>Goal Clicker braucht Internet für Login und Spielstand. Sobald du wieder online bist, geht es weiter.</p>
  <button type="button" onclick="location.reload()">Erneut versuchen</button>
</main>
</body>
</html>
